version: '3.8'
services:
  hive-ctf:
    build: .
    container_name: hive-phantom-wire-ctf
    ports:
      - "8080:3000"
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
# Usage:
#   docker compose up -d   →  start
#   open http://localhost:8080
#   docker compose down    →  stop
