version: '3.8'

services:
  hive-forensics-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: hive-consult/forensics-lab:2.0
    container_name: hive-forensics-lab
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.hiveconsult.lab=email-forensics-v2"
      - "com.hiveconsult.author=Nana Sei Anyemedu"
      - "com.hiveconsult.version=2.0"
