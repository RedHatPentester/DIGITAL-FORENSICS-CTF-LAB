version: '3.8'

services:
  hive-ctf:
    build: .
    container_name: hive-forensics-ctf
    ports:
      - "8080:3000"
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

# ─── USAGE ────────────────────────────────────────────────────────
#
#   Start:   docker compose up -d
#   Access:  http://localhost:8080
#   Logs:    docker compose logs -f
#   Stop:    docker compose down
#
#   Flags are stored in server.js only — never sent to the browser.
#   All flag submissions go to POST /api/check and are validated
#   server-side. Inspecting client source reveals encoded evidence
#   only, not the answers.
#
# ─────────────────────────────────────────────────────────────────
